<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="top-title top-desc">
  <title id="top-title">Long-Running Task Topology: Single-Node vs Decoupled Architecture</title>
  <desc id="top-desc">Single-node agents track background tasks via OS process trees; decoupled architectures require cross-network state transfer, cursor persistence, and event resumption.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#E6EBF2" stroke-width="1"/></pattern>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7Z" fill="#1463E9"/></marker>
    <marker id="arrow-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7Z" fill="#17191C"/></marker>
    <style>
      text { font-family: Inter, 'PingFang SC', 'Noto Sans SC', sans-serif; }
      .title { fill:#17191C; font-size:30px; font-weight:760; letter-spacing:-.7px; }
      .subtitle { fill:#536171; font-size:14.5px; }
      .panel { fill:#FFFFFF; stroke:#17191C; stroke-width:2; }
      .panel-title { fill:#17191C; font-size:20px; font-weight:750; }
      .panel-sub { fill:#536171; font-size:13.5px; }
      .scope { fill:#F8FBFF; stroke:#B6C7DC; stroke-width:1.8; }
      .scope-blue { fill:#F5F9FF; stroke:#1463E9; stroke-width:2.2; }
      .scope-label { fill:#394554; font-size:13px; font-weight:700; letter-spacing:.2px; }
      .box { fill:#FFFFFF; stroke:#17191C; stroke-width:1.6; }
      .box-blue { fill:#EAF2FE; stroke:#1463E9; stroke-width:2; }
      .box-title { fill:#17191C; font-size:14.5px; font-weight:720; }
      .box-sub { fill:#536171; font-size:11.5px; }
      .line-blue { fill:none; stroke:#1463E9; stroke-width:2.2; marker-end:url(#arrow-blue); stroke-linecap:round; stroke-linejoin:round; }
      .line-ink { fill:none; stroke:#17191C; stroke-width:1.8; marker-end:url(#arrow-ink); stroke-linecap:round; }
      .line-dashed { fill:none; stroke:#E05A47; stroke-width:1.8; stroke-dasharray:6 5; }
      .net-label { fill:#B43625; font-size:12px; font-weight:700; }
      .claim { fill:#17191C; font-size:13.5px; font-weight:720; }
      .flow-chip { fill:#FFFFFF; stroke:#1463E9; stroke-width:1.3; }
      .flow-chip-text { fill:#1463E9; font-size:11px; font-weight:650; }
      .footer { fill:#FFFFFF; stroke:#17191C; stroke-width:1.5; }
      .footer-copy { fill:#394554; font-size:13.5px; }
    </style>
  </defs>
  <rect width="1600" height="920" fill="#FCFCFA"/><rect width="1600" height="920" fill="url(#grid)"/>

  <!-- Top Titles -->
  <text x="40" y="52" class="title">Long-Running Task Topology: Single-Node vs Decoupled Architecture</text>
  <text x="40" y="80" class="subtitle">Single-node agents track background tasks via OS process trees; decoupled architectures require cross-network state transfer, cursor persistence, and event resumption.</text>

  <!-- Left: Single-Node Agent -->
  <rect x="40" y="112" width="730" height="664" rx="20" class="panel"/>
  <text x="68" y="151" class="panel-title">Single-Node Agent (e.g. Claude Code / Codex)</text>
  <text x="68" y="177" class="panel-sub">Brain and hand share host OS memory and process tree</text>

  <rect x="66" y="204" width="678" height="460" rx="16" class="scope"/>
  <text x="90" y="236" class="scope-label">Local Host Environment (Single Machine)</text>

  <!-- Left Box: Agent Process -->
  <rect x="110" y="266" width="590" height="110" rx="12" class="box"/>
  <text x="136" y="306" class="box-title">Agent Process (CLI / Memory)</text>
  <text x="136" y="334" class="box-sub">Inference Loop · In-Memory State · Local Router</text>

  <!-- Left Center Arrow & IPC Box -->
  <path d="M370 376v76" class="line-ink"/>
  <path d="M440 452v-76" class="line-ink"/>
  <rect x="220" y="398" width="370" height="32" rx="7" fill="#FFFFFF" stroke="#17191C" stroke-width="1.3"/>
  <text x="405" y="419" text-anchor="middle" class="box-sub" style="font-weight:650; fill:#17191C">Local OS IPC (PID Polling · Unix Pipes stdout · SIGTERM Signals)</text>

  <!-- Left Box: Shell Subprocess -->
  <rect x="110" y="456" width="590" height="110" rx="12" class="box"/>
  <text x="136" y="496" class="box-title">Background Shell Subprocess</text>
  <text x="136" y="524" class="box-sub">Build · Test · Batch Processing · Scripts</text>

  <!-- Left Highlight Badge -->
  <path d="M86 706h638" stroke="#FFE24A" stroke-width="26" stroke-linecap="round" opacity=".8"/>
  <text x="405" y="713" text-anchor="middle" class="claim">No network boundary · No gateway timeouts · Local in-memory process handles</text>

  <!-- Right: Decoupled Agent -->
  <rect x="830" y="112" width="730" height="664" rx="20" class="panel"/>
  <text x="858" y="151" class="panel-title">Decoupled Architecture (CubePlex + Remote Sandboxes)</text>
  <text x="858" y="177" class="panel-sub">Control plane owns state and policy; remote sandboxes lease compute</text>

  <!-- Right Top: Control Plane -->
  <rect x="856" y="204" width="678" height="180" rx="16" class="scope-blue"/>
  <text x="880" y="234" class="scope-label">Protected Control Plane (API / Workers)</text>

  <rect x="878" y="250" width="206" height="112" rx="10" class="box-blue"/>
  <text x="981" y="286" text-anchor="middle" class="box-title">Agent Harness</text>
  <text x="981" y="314" text-anchor="middle" class="box-sub">CubeLoop While-Loop</text>
  <text x="981" y="334" text-anchor="middle" class="box-sub" style="color:#1463E9; font-weight:600">TodoList Middleware Guard</text>

  <rect x="1092" y="250" width="206" height="112" rx="10" class="box"/>
  <text x="1195" y="286" text-anchor="middle" class="box-title">Persistent Database</text>
  <text x="1195" y="314" text-anchor="middle" class="box-sub">Command Log Commit</text>
  <text x="1195" y="334" text-anchor="middle" class="box-sub">Checkpointer State</text>

  <rect x="1306" y="250" width="208" height="112" rx="10" class="box"/>
  <text x="1410" y="286" text-anchor="middle" class="box-title">Events &amp; Run Locks</text>
  <text x="1410" y="314" text-anchor="middle" class="box-sub">Internal Task Event</text>
  <text x="1410" y="334" text-anchor="middle" class="box-sub">Active Run Lock Queue</text>

  <!-- Network Boundary Divider -->
  <line x1="856" y1="416" x2="1534" y2="416" class="line-dashed"/>
  <rect x="980" y="402" width="430" height="28" rx="14" fill="#FFF2F0" stroke="#E05A47" stroke-width="1.3"/>
  <text x="1195" y="421" text-anchor="middle" class="net-label">Network Boundary (Reverse Proxy / Ingress · 60s Read Timeout)</text>

  <!-- Right Center 4 Flow Chips -->
  <rect x="878" y="440" width="144" height="26" rx="6" class="flow-chip"/>
  <text x="950" y="457" text-anchor="middle" class="flow-chip-text">① 60s Task Demotion &amp; Registration</text>

  <rect x="1034" y="440" width="168" height="26" rx="6" class="flow-chip"/>
  <text x="1118" y="457" text-anchor="middle" class="flow-chip-text">② Cursor Advance upon Commit</text>

  <rect x="1214" y="440" width="144" height="26" rx="6" class="flow-chip"/>
  <text x="1286" y="457" text-anchor="middle" class="flow-chip-text">③ Generation-Fenced Stop Signal</text>

  <rect x="1370" y="440" width="144" height="26" rx="6" class="flow-chip"/>
  <text x="1442" y="457" text-anchor="middle" class="flow-chip-text">④ Internal Event Idle Resumption</text>

  <!-- Down & Up Connecting Arrows across network -->
  <path d="M981 362v74" class="line-blue"/>
  <path d="M1195 480v-48" class="line-blue"/>
  <path d="M1410 480v-48" class="line-blue"/>

  <!-- Right Bottom: Remote Sandbox -->
  <rect x="856" y="480" width="678" height="184" rx="16" class="scope"/>
  <text x="880" y="508" class="scope-label">Remote Isolated Sandbox (CubeSandbox / K8s Pod)</text>

  <rect x="886" y="526" width="300" height="114" rx="10" class="box"/>
  <text x="1036" y="568" text-anchor="middle" class="box-title">Sandbox Execution Daemon</text>
  <text x="1036" y="596" text-anchor="middle" class="box-sub">Provider Runner · Log Cursor Reporting</text>

  <rect x="1210" y="526" width="304" height="114" rx="10" class="box-blue"/>
  <text x="1362" y="568" text-anchor="middle" class="box-title">Persistent Background Command</text>
  <text x="1362" y="596" text-anchor="middle" class="box-sub">Isolated cgroup / Container · Default 1-Hour Deadline</text>

  <!-- Right Highlight Badge -->
  <path d="M876 706h638" stroke="#FFE24A" stroke-width="26" stroke-linecap="round" opacity=".8"/>
  <text x="1195" y="713" text-anchor="middle" class="claim">Cross-network state transfer · Host validation contract · Resilient log recovery · Generation fence</text>

  <!-- Bottom Global Footer -->
  <rect x="40" y="812" width="1520" height="70" rx="16" class="footer"/>
  <circle cx="74" cy="847" r="10" fill="#1463E9"/>
  <path d="M70 847l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="98" y="852" class="footer-copy">Local background tasks are OS process handles; decoupled architectures require distributed lifecycle governance across failure domains.</text>
</svg>