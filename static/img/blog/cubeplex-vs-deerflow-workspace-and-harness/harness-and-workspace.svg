<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Harness 线程 vs Workspace 边界</title>
  <desc id="desc">要一条可编排的长程 harness 线程，看 DeerFlow 2.0。要团队共用、可治理的长期工作现场，看 CubePlex Workspace。</desc>
  <defs>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#E6EBF2" stroke-width="1"/></pattern>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8Z" fill="#1463E9"/></marker>
    <marker id="arrow-ink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8Z" fill="#17191C"/></marker>
    <style>
      text { font-family: Inter, 'PingFang SC', 'Noto Sans SC', sans-serif; }
      .title { fill:#17191C; font-size:30px; font-weight:750; letter-spacing:-.6px; }
      .subtitle { fill:#536171; font-size:15px; }
      .panel { fill:#FFFFFF; stroke:#17191C; stroke-width:2; }
      .panel-title { fill:#17191C; font-size:17px; font-weight:700; }
      .panel-copy { fill:#536171; font-size:12.5px; }
      .entry { fill:#FFFFFF; stroke:#17191C; stroke-width:1.7; }
      .key { fill:#EAF2FE; stroke:#1463E9; stroke-width:2.2; }
      .agent { fill:#1463E9; stroke:#17191C; stroke-width:2; }
      .sandbox { fill:#EAF2FE; stroke:#17191C; stroke-width:1.7; }
      .workspace { fill:#EAF2FE; stroke:#1463E9; stroke-width:2.5; }
      .box-title { fill:#17191C; font-weight:700; }
      .agent-title { fill:#FFFFFF; }
      .box-sub { fill:#536171; font-size:12px; }
      .agent-copy { fill:#FFFFFF; font-size:13px; }
      .line-blue { fill:none; stroke:#1463E9; stroke-width:2.2; marker-end:url(#arrow-blue); stroke-linecap:round; stroke-linejoin:round; }
      .line-ink { fill:none; stroke:#17191C; stroke-width:1.6; marker-end:url(#arrow-ink); stroke-linecap:round; stroke-linejoin:round; }
      .chip { fill:#FFE24A; opacity:.78; }
      .foot { fill:#FFFFFF; stroke:#17191C; stroke-width:1.5; }
      .foot-title { fill:#17191C; font-size:14px; font-weight:750; }
      .foot-copy { fill:#394554; font-size:13.5px; }
    </style>
  </defs>
  <rect width="1600" height="920" fill="#FCFCFA"/><rect width="1600" height="920" fill="url(#grid)"/>
  <path d="M48 88C210 28 380 36 470 96" fill="none" stroke="#EAF2FE" stroke-width="28" stroke-linecap="round"/>
  <text x="48" y="52" class="title">Harness 线程 vs Workspace 边界</text>
  <text x="48" y="78" class="subtitle">DeerFlow 2.0 以 Gateway + Thread/Run 跑长程任务；CubePlex 以 Workspace 固定团队 Agent 与治理入口。</text>

  <rect x="40" y="110" width="740" height="680" rx="22" class="panel"/>
  <text x="68" y="148" class="panel-title">DeerFlow 2.0：Super Agent Harness</text>
  <text x="68" y="172" class="panel-copy">Lead Agent 编排 skills、工具、sub-agent；sandbox 服务本次 run</text>
  <rect x="250" y="198" width="320" height="52" rx="12" class="entry"/>
    <text x="410" y="229" text-anchor="middle" class="box-title" style="font-size:16px">Gateway</text>
    
  <path d="M410 250V284" class="line-blue"/>
  <rect x="160" y="284" width="220" height="56" rx="12" class="entry"/>
    <text x="270" y="317" text-anchor="middle" class="box-title" style="font-size:15px">Thread</text>
    
  <rect x="440" y="284" width="220" height="56" rx="12" class="key"/>
    <text x="550" y="317" text-anchor="middle" class="box-title" style="font-size:15px">Run</text>
    
  <path d="M550 340V372" class="line-blue"/>
  <rect x="200" y="372" width="420" height="78" rx="12" class="agent"/>
  <text x="410" y="404" text-anchor="middle" class="agent-title" style="font-size:17px;font-weight:700">Lead Agent</text>
  <text x="410" y="428" text-anchor="middle" class="agent-copy">LangGraph / LangChain</text>
  <path d="M300 450V480" class="line-ink"/><path d="M520 450V480" class="line-ink"/>
  <rect x="120" y="480" width="260" height="56" rx="12" class="entry"/>
    <text x="250" y="513" text-anchor="middle" class="box-title" style="font-size:14px">Skills · Tools</text>
    
  <rect x="440" y="480" width="260" height="56" rx="12" class="entry"/>
    <text x="570" y="513" text-anchor="middle" class="box-title" style="font-size:14px">Sub-agents</text>
    
  <path d="M410 536V566" class="line-blue"/>
  <rect x="200" y="566" width="420" height="88" rx="12" class="sandbox"/>
    <text x="410" y="604" text-anchor="middle" class="box-title" style="font-size:16px">Sandbox</text>
    <text x="410" y="626" text-anchor="middle" class="box-sub">Local / Docker / K8s</text>
  <path d="M410 654V682" class="line-ink"/>
  <rect x="200" y="682" width="420" height="52" rx="12" class="entry"/>
    <text x="410" y="713" text-anchor="middle" class="box-title" style="font-size:14px">IM 通道（可选）</text>
    

  <rect x="820" y="110" width="740" height="680" rx="22" class="panel"/>
  <rect x="846" y="128" width="90" height="22" rx="4" class="chip"/>
  <text x="848" y="148" class="panel-title">CubePlex：团队 Agent Workspace</text>
  <text x="848" y="172" class="panel-copy">先定 Workspace Agent，再由入口切会话、身份与执行</text>
  <rect x="1040" y="198" width="300" height="52" rx="12" class="entry"/>
    <text x="1190" y="229" text-anchor="middle" class="box-title" style="font-size:16px">Org</text>
    
  <path d="M1190 250V280" class="line-blue"/>
  <rect x="900" y="280" width="580" height="430" rx="18" class="workspace"/>
  <text x="930" y="314" class="box-title" style="font-size:15px">Workspace</text>
  <rect x="940" y="336" width="500" height="78" rx="12" class="agent"/>
  <text x="1190" y="368" text-anchor="middle" class="agent-title" style="font-size:16px;font-weight:700">Team Agent</text>
  <text x="1190" y="392" text-anchor="middle" class="agent-copy">Persona · Skills · MCP · memory</text>
  <path d="M1190 414V444" class="line-blue"/>
  <rect x="940" y="444" width="500" height="88" rx="12" class="sandbox"/>
    <text x="1190" y="482" text-anchor="middle" class="box-title" style="font-size:16px">Durable Sandbox</text>
    <text x="1190" y="504" text-anchor="middle" class="box-sub">跨重启保留工作现场</text>
  <path d="M1190 532V560" class="line-ink"/>
  <rect x="940" y="560" width="500" height="56" rx="12" class="entry"/>
    <text x="1190" y="593" text-anchor="middle" class="box-title" style="font-size:13px">Web · Slack · Discord · Teams · 飞书 · 钉钉 · 企微</text>
    
  <path d="M1190 616V640" class="line-ink"/>
  <rect x="940" y="640" width="500" height="40" rx="12" class="entry"/>
    <text x="1190" y="665" text-anchor="middle" class="box-title" style="font-size:13px">角色 · 审批 · 共享策略</text>
    

  <rect x="40" y="816" width="1520" height="70" rx="15" class="foot"/>
  <rect x="64" y="836" width="70" height="20" rx="3" class="chip"/>
  <text x="68" y="852" class="foot-title">怎么选</text>
  <text x="150" y="853" class="foot-copy">要一条可编排的长程 harness 线程，看 DeerFlow 2.0。要团队共用、可治理的长期工作现场，看 CubePlex Workspace。</text>
</svg>