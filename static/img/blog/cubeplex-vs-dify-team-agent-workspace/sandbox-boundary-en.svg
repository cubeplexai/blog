<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Long-lived Agent vs Scenario Apps</title>
  <desc id="desc">Dify packages capabilities into Apps; CubePlex brings different work to one long-lived Agent.</desc>
  <defs>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#E6EBF2" stroke-width="1"/></pattern>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8Z" fill="#1463E9"/></marker>
    <style>
      text { font-family: Inter, 'PingFang SC', 'Noto Sans SC', sans-serif; }
      .title { fill:#17191C; font-size:31px; font-weight:760; letter-spacing:-.6px; }
      .subtitle { fill:#536171; font-size:15px; }
      .panel { fill:#FFFFFF; stroke:#17191C; stroke-width:2; }
      .panel-title { fill:#17191C; font-size:19px; font-weight:730; }
      .panel-sub { fill:#536171; font-size:13px; }
      .card { fill:#FFFFFF; stroke:#17191C; stroke-width:1.7; }
      .app-card { fill:#EAF2FE; stroke:#1463E9; stroke-width:2.1; }
      .agent-card { fill:#1463E9; stroke:#17191C; stroke-width:2.1; }
      .computer-card { fill:#EAF2FE; stroke:#17191C; stroke-width:1.7; }
      .task-card { fill:#FFFFFF; stroke:#1463E9; stroke-width:1.7; }
      .card-title { fill:#17191C; font-weight:700; }
      .agent-card + text, .agent-title { fill:#FFFFFF; }
      .card-sub { fill:#536171; font-size:12px; }
      .agent-sub { fill:#FFFFFF; font-size:12.5px; }
      .line { fill:none; stroke:#1463E9; stroke-width:2.3; marker-end:url(#arrow-blue); stroke-linecap:round; stroke-linejoin:round; }
      .line-dashed { fill:none; stroke:#1463E9; stroke-width:1.8; stroke-dasharray:7 7; stroke-linecap:round; }
      .label { fill:#536171; font-size:12.5px; }
      .chip { fill:#FFE24A; opacity:.78; }
      .foot { fill:#FFFFFF; stroke:#17191C; stroke-width:1.5; }
      .foot-title { fill:#17191C; font-size:14px; font-weight:750; }
      .foot-copy { fill:#394554; font-size:13.5px; }
      .icon-fill { fill:#EAF2FE; stroke:#17191C; stroke-width:2; }
      .icon-line { fill:none; stroke:#17191C; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
      .icon-line-small { fill:none; stroke:#17191C; stroke-width:1.7; stroke-linecap:round; }
      .icon-box { fill:#FFFFFF; stroke:#17191C; stroke-width:1.8; }
      .agent-head { fill:#1463E9; stroke:#17191C; stroke-width:2.2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FCFCFA"/><rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M45 88C205 26 370 38 480 100" fill="none" stroke="#EAF2FE" stroke-width="28" stroke-linecap="round"/>
  <text x="48" y="51" class="title">Long-lived Agent vs Scenario Apps</text>
  <text x="48" y="78" class="subtitle">Two products start work from different places</text>

  <rect x="40" y="110" width="740" height="650" rx="22" class="panel"/>
  <text x="70" y="151" class="panel-title">Dify: choose a scenario App first</text>
  <text x="70" y="176" class="panel-sub">Each App packages the model, flow, knowledge, and tools for one problem</text>
  <circle cx="122" cy="255" r="17" class="icon-fill"/>
    <path d="M92 297C96 267 148 267 152 297" class="icon-line"/>
  <text x="122" y="322" text-anchor="middle" class="label">User</text>
  <path d="M156 263H214" class="line"/>
  <path d="M214 263V236H274M214 263H274M214 263V290H274" class="line-dashed"/>
  <rect x="287" y="214" width="46" height="44" rx="8" class="icon-box"/>
    <circle cx="300" cy="227" r="3" fill="#1463E9"/>
    <path d="M296 238H323M296 247H317" class="icon-line-small"/><rect x="350" y="202" width="350" height="68" rx="14" class="app-card"/>
    <text x="525" y="241" text-anchor="middle" class="card-title" style="font-size:14px">Knowledge Q&amp;A App</text>

  <rect x="287" y="298" width="46" height="44" rx="8" class="icon-box"/>
    <circle cx="300" cy="311" r="3" fill="#1463E9"/>
    <path d="M296 322H323M296 331H317" class="icon-line-small"/><rect x="350" y="286" width="350" height="68" rx="14" class="app-card"/>
    <text x="525" y="325" text-anchor="middle" class="card-title" style="font-size:14px">Contract Review App</text>

  <rect x="287" y="382" width="46" height="44" rx="8" class="icon-box"/>
    <circle cx="300" cy="395" r="3" fill="#1463E9"/>
    <path d="M296 406H323M296 415H317" class="icon-line-small"/><rect x="350" y="370" width="350" height="68" rx="14" class="app-card"/>
    <text x="525" y="409" text-anchor="middle" class="card-title" style="font-size:14px">Report Workflow</text>

  <path d="M525 438V478" class="line"/>
  <rect x="215" y="478" width="485" height="76" rx="14" class="card"/>
    <text x="457.5" y="521" text-anchor="middle" class="card-title" style="font-size:13px">separate config · publish · entry</text>

  <path d="M458 554V590" class="line"/>
  <rect x="215" y="590" width="485" height="68" rx="14" class="card"/>
    <text x="457.5" y="629" text-anchor="middle" class="card-title" style="font-size:14px">Web App · API · Embed · MCP</text>


  <rect x="820" y="110" width="740" height="650" rx="22" class="panel"/>
  <rect x="846" y="130" width="98" height="23" rx="4" class="chip"/>
  <text x="850" y="151" class="panel-title">CubePlex: enter a long-lived Agent first</text>
  <text x="850" y="176" class="panel-sub">Different work reuses one Workspace Agent and its long-term context</text>
  <circle cx="900" cy="255" r="17" class="icon-fill"/>
    <path d="M870 297C874 267 926 267 930 297" class="icon-line"/>
  <text x="900" y="322" text-anchor="middle" class="label">Person / Team</text>
  <path d="M935 263H1000" class="line"/>
  <rect x="1000" y="208" width="470" height="112" rx="17" class="agent-card"/>
  <rect x="1026" y="238" width="68" height="50" rx="17" class="agent-head"/>
    <path d="M1060 238V226M1038 292L1030 312M1082 292L1090 312" class="icon-line"/>
    <circle cx="1046" cy="263" r="4" fill="#FFFFFF"/><circle cx="1074" cy="263" r="4" fill="#FFFFFF"/>
  <text x="1230" y="253" text-anchor="middle" class="agent-title" style="font-size:18px;font-weight:730">Workspace Agent</text>
  <text x="1230" y="281" text-anchor="middle" class="agent-sub">Persona · memory · Skills · MCP</text>
  <path d="M1235 320V370" class="line"/>
  <rect x="995" y="370" width="120" height="62" rx="14" class="task-card"/>
    <text x="1055" y="406" text-anchor="middle" class="card-title" style="font-size:14px">Research</text>

  <rect x="1130" y="370" width="120" height="62" rx="14" class="task-card"/>
    <text x="1190" y="406" text-anchor="middle" class="card-title" style="font-size:14px">Coding</text>

  <rect x="1265" y="370" width="120" height="62" rx="14" class="task-card"/>
    <text x="1325" y="406" text-anchor="middle" class="card-title" style="font-size:14px">Operations</text>

  <rect x="1400" y="370" width="120" height="62" rx="14" class="task-card"/>
    <text x="1460" y="406" text-anchor="middle" class="card-title" style="font-size:14px">Content</text>

  <path d="M1055 370V350H1460V370M1190 350V370M1325 350V370" class="line-dashed"/>
  <path d="M1235 432V492" class="line"/>
  <rect x="1000" y="492" width="470" height="94" rx="14" class="computer-card"/>
    <text x="1235" y="534" text-anchor="middle" class="card-title" style="font-size:15px">Durable computer environment</text>
    <text x="1235" y="557" text-anchor="middle" class="card-sub">scoped by user / conversation / topic</text>
  <path d="M1035 610C1100 650 1380 650 1445 610" fill="none" stroke="#EAF2FE" stroke-width="22" stroke-linecap="round"/>

  <rect x="40" y="790" width="1520" height="72" rx="15" class="foot"/>
  <rect x="64" y="811" width="105" height="21" rx="3" class="chip"/>
  <text x="68" y="828" class="foot-title">Starting point</text>
  <text x="190" y="829" class="foot-copy">Dify packages capabilities into Apps; CubePlex brings different work to one long-lived Agent.</text>
</svg>