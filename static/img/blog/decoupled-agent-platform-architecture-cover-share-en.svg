<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1356" height="1056" viewBox="0 0 1356 1056" role="img">
  <defs>
    <pattern id="share-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#e6ebf2" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1356" height="1056" fill="#fcfcfa"/>
  <rect width="1356" height="1056" fill="url(#share-grid)" opacity="0.6"/>

  <!-- Logo -->
  <image href="data:image/svg+xml;base64," x="80" y="86" width="220" height="50"/>

  <rect x="80" y="184" width="64" height="7" rx="3.5" fill="#1463e9"/>

  <!-- Yellow marker behind title Line 2 -->
  <path d="M70 380 H780 V445 H74 Z" fill="#FFE24A" opacity="0.82" transform="rotate(-0.6 80 385)"/>

  <!-- Main Title -->
  <text x="80" y="315" fill="#17191c" font-family="Inter, -apple-system, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.5">
    <tspan x="80" dy="0">Decoupled Brain &amp; Hand:</tspan>
    <tspan x="80" dy="90" font-size="58">Enterprise Agent Platforms</tspan>
    <tspan x="80" dy="90" font-size="50" fill="#394554">Architecture &amp; Boundary Governance</tspan>
  </text>

  <!-- Illustration embedded in Share card (Bottom half) -->
  <g transform="translate(140, 560)">
    <!-- Control Plane -->
    <rect x="0" y="0" width="440" height="380" rx="20" fill="#f4f8ff" stroke="#1463e9" stroke-width="3"/>
    <rect x="28" y="24" width="160" height="28" rx="6" fill="#1463e9"/>
    <text x="108" y="43" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Brain · Control Plane</text>
    <text x="28" y="84" fill="#17191c" font-family="Inter, sans-serif" font-size="20" font-weight="750">Control Plane (Harness)</text>
    
    <rect x="28" y="110" width="384" height="64" rx="8" fill="#ffffff" stroke="#1463e9" stroke-width="1.5"/>
    <text x="44" y="148" fill="#17191c" font-family="Inter, sans-serif" font-size="16" font-weight="600">Harness Reasoning State Machine</text>

    <rect x="28" y="190" width="384" height="64" rx="8" fill="#ffffff" stroke="#1463e9" stroke-width="1.5"/>
    <text x="44" y="228" fill="#17191c" font-family="Inter, sans-serif" font-size="16" font-weight="600">Append-Only Incremental Store (O(1))</text>

    <rect x="28" y="270" width="384" height="64" rx="8" fill="#ffffff" stroke="#1463e9" stroke-width="1.5"/>
    <text x="44" y="308" fill="#17191c" font-family="Inter, sans-serif" font-size="16" font-weight="600">HITL Engine &amp; Policy Whitelist</text>

    <!-- Secret Broker in the middle -->
    <rect x="490" y="140" width="100" height="100" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <circle cx="540" cy="190" r="24" fill="#d97706" opacity="0.15"/>
    <path d="M533 190v-7a7 7 0 0 1 14 0v7m-18 0h22a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3h-22a3 3 0 0 1-3-3v-11a3 3 0 0 1 3-3Z" fill="none" stroke="#d97706" stroke-width="2.5"/>
    <text x="540" y="260" text-anchor="middle" fill="#d97706" font-family="Inter, sans-serif" font-size="13" font-weight="700">Secret Broker</text>

    <path d="M440 190 H 490" stroke="#1463e9" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M590 190 H 640" stroke="#0d9488" stroke-width="3" stroke-dasharray="6 5"/>

    <!-- Execution Sandbox -->
    <rect x="640" y="0" width="440" height="380" rx="20" fill="#f0fdf4" stroke="#0d9488" stroke-width="3"/>
    <rect x="668" y="24" width="160" height="28" rx="6" fill="#0d9488"/>
    <text x="748" y="43" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Hand · Sandbox Pool</text>
    <text x="668" y="84" fill="#17191c" font-family="Inter, sans-serif" font-size="20" font-weight="750">Data Plane (Sandbox Pool)</text>

    <rect x="668" y="110" width="384" height="64" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <text x="684" y="148" fill="#17191c" font-family="Inter, sans-serif" font-size="16" font-weight="600">Isolated Pods / MicroVMs</text>

    <rect x="668" y="190" width="384" height="64" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <text x="684" y="228" fill="#17191c" font-family="Inter, sans-serif" font-size="16" font-weight="600">60s Background Task Runner</text>

    <rect x="668" y="270" width="384" height="64" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <text x="684" y="308" fill="#17191c" font-family="Inter, sans-serif" font-size="16" font-weight="600">Persistent PVC Storage Mount</text>
