<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Two Ways to Organize Agent State</title>
  <desc id="desc">QM organizes resources separately with each scope. CubePlex reuses capabilities in a workspace while keeping state and execution at the appropriate entry-point boundary.</desc>
  <defs>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#E6EBF2" stroke-width="1"/></pattern>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8Z" fill="#1463E9"/></marker>
    <marker id="arrow-ink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8Z" fill="#17191C"/></marker>
    <style>
      text { font-family: Inter, 'PingFang SC', 'Noto Sans SC', sans-serif; }
      .title { fill:#17191C; font-size:33px; font-weight:750; letter-spacing:-.8px; }
      .subtitle { fill:#536171; font-size:16px; }
      .panel { fill:#FFFFFF; stroke:#17191C; stroke-width:2; }
      .panel-title { fill:#17191C; font-size:20px; font-weight:700; }
      .panel-copy { fill:#536171; font-size:13px; }
      .scope { fill:#EAF2FE; stroke:#17191C; stroke-width:1.7; }
      .workspace { fill:#EAF2FE; stroke:#1463E9; stroke-width:2.5; }
      .agent { fill:#1463E9; stroke:#17191C; stroke-width:2; }
      .entry { fill:#FFFFFF; stroke:#17191C; stroke-width:1.7; }
      .run { fill:#FFFFFF; stroke:#1463E9; stroke-width:2; }
      .sandbox { fill:#EAF2FE; stroke:#17191C; stroke-width:1.7; }
      .box-title { fill:#17191C; font-weight:700; }
      .agent .box-title { fill:#FFFFFF; }
      .box-sub { fill:#536171; font-size:12.5px; }
      .agent-copy { fill:#FFFFFF; font-size:14px; }
      .scope-copy { fill:#536171; font-size:11px; }
      .line-blue { fill:none; stroke:#1463E9; stroke-width:2.3; marker-end:url(#arrow-blue); stroke-linecap:round; stroke-linejoin:round; }
      .line-ink { fill:none; stroke:#17191C; stroke-width:1.7; marker-end:url(#arrow-ink); stroke-linecap:round; stroke-linejoin:round; }
      .line-quiet { fill:none; stroke:#7B8794; stroke-width:1.5; stroke-dasharray:6 6; stroke-linecap:round; }
      .chip { fill:#FFE24A; opacity:.78; }
      .foot { fill:#FFFFFF; stroke:#17191C; stroke-width:1.5; }
      .foot-title { fill:#17191C; font-size:14px; font-weight:750; }
      .foot-copy { fill:#394554; font-size:14px; }
    </style>
  </defs>
  <rect width="1600" height="950" fill="#FCFCFA"/><rect width="1600" height="950" fill="url(#grid)"/>
  <path d="M43 102C220 25 402 40 508 111" fill="none" stroke="#EAF2FE" stroke-width="34" stroke-linecap="round"/>
  <text x="48" y="62" class="title">Two Ways to Organize Agent State</text>
  <text x="48" y="90" class="subtitle">QM derives scopes from Slack locations. CubePlex defines a Workspace Agent first, then separates the context of each run.</text>

  <rect x="42" y="126" width="750" height="682" rx="22" class="panel"/>
  <text x="72" y="165" class="panel-title">QM: every scope is a separate work-environment boundary</text><text x="72" y="189" class="panel-copy">Slack people, channels, group DMs, and projects resolve to distinct scopes</text>
  <rect x="305" y="220" width="224" height="64" rx="14" class="entry"/>
    <text x="417" y="258" text-anchor="middle" class="box-title" style="font-size:20px">Slack</text>
    
  <path d="M417 284V327H183V360" class="line-ink"/><path d="M417 327H409V360" class="line-ink"/><path d="M417 327H635V360" class="line-ink"/>
  <rect x="83" y="360" width="200" height="150" rx="14" class="scope"/>
    <text x="183" y="441" text-anchor="middle" class="box-title" style="font-size:16px">Personal scope</text>
    <rect x="103" y="460" width="160" height="43" rx="8" fill="#FFFFFF" stroke="#17191C" stroke-width="1"/><text x="183" y="478" text-anchor="middle" class="scope-copy">memory · files · skills</text><text x="183" y="495" text-anchor="middle" class="scope-copy">credentials · sandbox</text><rect x="309" y="360" width="200" height="150" rx="14" class="scope"/>
    <text x="409" y="441" text-anchor="middle" class="box-title" style="font-size:16px">Channel scope</text>
    <rect x="329" y="460" width="160" height="43" rx="8" fill="#FFFFFF" stroke="#17191C" stroke-width="1"/><text x="409" y="478" text-anchor="middle" class="scope-copy">memory · files · skills</text><text x="409" y="495" text-anchor="middle" class="scope-copy">credentials · sandbox</text><rect x="535" y="360" width="200" height="150" rx="14" class="scope"/>
    <text x="635" y="441" text-anchor="middle" class="box-title" style="font-size:16px">Project / group scope</text>
    <rect x="555" y="460" width="160" height="43" rx="8" fill="#FFFFFF" stroke="#17191C" stroke-width="1"/><text x="635" y="478" text-anchor="middle" class="scope-copy">memory · files · skills</text><text x="635" y="495" text-anchor="middle" class="scope-copy">credentials · sandbox</text>
  <path d="M183 510V569" class="line-ink"/><path d="M409 510V569" class="line-ink"/><path d="M635 510V569" class="line-ink"/>
  <rect x="83" y="570" width="200" height="85" rx="14" class="sandbox"/>
    <text x="183" y="618.5" text-anchor="middle" class="box-title" style="font-size:17px">Sandbox</text>
    <rect x="309" y="570" width="200" height="85" rx="14" class="sandbox"/>
    <text x="409" y="618.5" text-anchor="middle" class="box-title" style="font-size:17px">Sandbox</text>
    <rect x="535" y="570" width="200" height="85" rx="14" class="sandbox"/>
    <text x="635" y="618.5" text-anchor="middle" class="box-title" style="font-size:17px">Sandbox</text>
    
  <path d="M83 700H735" class="line-quiet"/><text x="409" y="731" text-anchor="middle" class="panel-copy">Resources and access relationships are organized per scope</text>

  <rect x="808" y="126" width="750" height="682" rx="22" class="panel"/>
  <rect x="834" y="143" width="147" height="23" rx="4" class="chip"/>
  <text x="838" y="165" class="panel-title">CubePlex: a Workspace reuses the long-lived agent definition</text><text x="838" y="189" class="panel-copy">An IM entry point determines the conversation, identity, authorization, and execution boundary for a run</text>
  <rect x="874" y="220" width="620" height="178" rx="19" class="workspace"/>
  <text x="904" y="252" class="box-title" style="font-size:16px">Workspace</text>
  <rect x="919" y="270" width="530" height="92" rx="14" class="agent"/>
  <text x="1184" y="306" text-anchor="middle" class="box-title" style="font-size:21px;fill:#FFFFFF">One long-lived Team Agent</text>
  <text x="1184" y="334" text-anchor="middle" class="agent-copy">Persona · Skills · MCP connectors · Workspace memory</text>
  <path d="M1184 398V435" class="line-blue"/>
  <rect x="888" y="436" width="592" height="58" rx="14" class="entry"/>
    <text x="1184" y="471" text-anchor="middle" class="box-title" style="font-size:14px">Web · Slack · Discord · Teams · Feishu · DingTalk · WeCom</text>
    
  <path d="M986 494V535" class="line-blue"/><path d="M1285 494V535" class="line-blue"/>
  <rect x="850" y="536" width="272" height="90" rx="14" class="run"/>
    <text x="986" y="576" text-anchor="middle" class="box-title" style="font-size:18px">Direct message</text>
    <text x="986" y="603" text-anchor="middle" class="box-sub">personal history · memory · credentials</text>
  <rect x="1150" y="536" width="340" height="90" rx="14" class="run"/>
    <text x="1320" y="576" text-anchor="middle" class="box-title" style="font-size:18px">Group chat</text>
    <text x="1320" y="603" text-anchor="middle" class="box-sub">routing selects sharing or per-member isolation</text>
  <path d="M986 626V655H950V681" class="line-blue"/><path d="M1320 626V655H1183V681" class="line-blue"/><path d="M1320 655H1416V681" class="line-blue"/>
  <rect x="850" y="682" width="200" height="78" rx="14" class="sandbox"/>
    <text x="950" y="716" text-anchor="middle" class="box-title" style="font-size:14px">DM Sandbox</text>
    <text x="950" y="743" text-anchor="middle" class="box-sub">isolated user / conversation</text>
  <rect x="1083" y="682" width="200" height="78" rx="14" class="sandbox"/>
    <text x="1183" y="716" text-anchor="middle" class="box-title" style="font-size:12.5px">Shared group Sandbox</text>
    <text x="1183" y="743" text-anchor="middle" class="box-sub">shared context</text>
  <rect x="1316" y="682" width="200" height="78" rx="14" class="sandbox"/>
    <text x="1416" y="716" text-anchor="middle" class="box-title" style="font-size:12.5px">Per-member Sandbox</text>
    <text x="1416" y="743" text-anchor="middle" class="box-sub">isolated per member</text>

  <rect x="42" y="840" width="1516" height="66" rx="15" class="foot"/>
  <rect x="66" y="858" width="82" height="20" rx="3" class="chip"/>
  <text x="69" y="874" class="foot-title">Key distinction</text>
  <text x="285" y="875" class="foot-copy">QM organizes resources separately with each scope. CubePlex reuses capabilities in a workspace while keeping state and execution at the appropriate entry-point boundary.</text>
</svg>