<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Managed Agents 的两种 Harness 架构</title>
  <desc id="desc">比较 Agent loop、持久状态与运行凭据分别位于控制面还是单个 Sandbox。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#27272a" stroke-width=".7"/></pattern>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7Z" fill="#6a83e3"/></marker>
    <marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7Z" fill="#71717a"/></marker>
    <style>
      text{font-family:Inter,'PingFang SC','Noto Sans SC',sans-serif}
      .mono{font-family:'JetBrains Mono','PingFang SC','Noto Sans SC',monospace}
      .title{fill:#f4f4f5;font-size:30px;font-weight:700;letter-spacing:-.5px}
      .subtitle{fill:#a1a1aa;font-size:15px}
      .panel{fill:#0a0a0b;stroke:#3f3f46;stroke-width:1.3}
      .panel-title{fill:#93a6ec;font-size:17px;font-weight:650}
      .panel-copy{fill:#71717a;font-size:12px}
      .box{fill:#0a0a0b;stroke:#3f3f46;stroke-width:1.25}
      .key{fill:#14213d;stroke:#6a83e3;stroke-width:1.7}
      .sandbox-frame{fill:#0c2f28;stroke:#34d399;stroke-width:1.7}
      .secret{fill:#101014;stroke:#52525b;stroke-width:1.25}
      .name{fill:#f4f4f5;font-size:15px;font-weight:600}
      .sub{fill:#a1a1aa;font-size:11.5px}
      .tiny{fill:#71717a;font-size:10.5px}
      .label{fill:#93a6ec;font-size:10.5px;font-weight:600}
      .line-blue{fill:none;stroke:#6a83e3;stroke-width:1.8;marker-end:url(#arrow-blue);stroke-linejoin:round}
      .line-gray{fill:none;stroke:#71717a;stroke-width:1.4;marker-end:url(#arrow-gray);stroke-linejoin:round}
      .line-secret{fill:none;stroke:#6a83e3;stroke-width:1.3;stroke-dasharray:5 5;marker-end:url(#arrow-blue);stroke-linejoin:round}
      .chip{fill:#18181b;stroke:#3f3f46;stroke-width:1}
      .chip-text{fill:#d4d4d8;font-size:10.5px}
      .foot{fill:#0a0a0b;stroke:#3f3f46;stroke-width:1.1}
      .foot-title{fill:#93a6ec;font-size:11px;font-weight:650}
      .foot-copy{fill:#a1a1aa;font-size:11px}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#18181b"/><rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="46" y="54" class="title">Managed Agents 的两种 Harness 架构</text><text x="46" y="82" class="subtitle">比较 Agent loop、持久状态与运行凭据分别位于控制面还是单个 Sandbox。</text>
  <rect x="42" y="118" width="735" height="790" rx="14" class="panel"/><rect x="823" y="118" width="735" height="790" rx="14" class="panel"/>
  <text x="72" y="153" class="panel-title">Sandbox 内 Harness</text><text x="72" y="176" class="panel-copy">模型循环、工具进程与运行凭据共享一个隔离环境</text>
  <text x="853" y="153" class="panel-title">控制面 Harness</text><text x="853" y="176" class="panel-copy">Agent 状态与长期凭据独立存在，Sandbox 是执行租约</text>

  <path d="M235 284V350H410V390" class="line-blue"/><path d="M542 390V284" class="line-gray"/><path d="M410 480V530" class="line-blue"/><path d="M410 620V670" class="line-blue"/>
  <rect x="82" y="215" width="306" height="69" rx="7" class="key"/>
  <text x="235" y="245.5" text-anchor="middle" class="name" style="font-size:14px">Managed Agent 管控面</text>
  <text x="235" y="266.5" text-anchor="middle" class="sub">definition · queue · status</text>

  <rect x="410" y="215" width="264" height="69" rx="7" class="box"/>
  <text x="542" y="245.5" text-anchor="middle" class="name">Model Provider</text>
  <text x="542" y="266.5" text-anchor="middle" class="sub">remote inference API</text>

  <rect x="72" y="330" width="675" height="525" rx="11" class="sandbox-frame"/><text x="94" y="362" class="label mono">SANDBOX · ONE AGENT</text>
  <rect x="115" y="390" width="590" height="90" rx="7" class="key"/>
  <text x="410" y="431" text-anchor="middle" class="name" style="font-size:17px">Agent Harness</text>
  <text x="410" y="452" text-anchor="middle" class="sub">context · model loop · retry · approval</text>

  <rect x="115" y="530" width="590" height="90" rx="7" class="box"/>
  <text x="410" y="571" text-anchor="middle" class="name" style="font-size:16px">Local Tool Runtime</text>
  <text x="410" y="592" text-anchor="middle" class="sub">Shell / PTY · Files · Browser · Workspace / MCP</text>

  <rect x="115" y="670" width="590" height="105" rx="7" class="secret"/>
  <text x="410" y="699" text-anchor="middle" class="name" style="font-size:16px">Sandbox env / secrets</text>
  <text x="410" y="720" text-anchor="middle" class="sub">模型密钥 · MCP token · 应用环境变量</text>
  <text x="410" y="740" text-anchor="middle" class="tiny mono">与 Harness 和工具进程处于同一边界</text>
  <rect x="115" y="670" width="5" height="105" rx="2" fill="#6a83e3"/>
  <text x="410" y="824" text-anchor="middle" class="tiny">Harness、tool runtime、env / secrets 随 Sandbox 一起启动与回收</text>

  <path d="M958 284V350" class="line-blue"/><path d="M1190 284V330H1190V350" class="line-gray"/><path d="M1370 284V330H1190V350" class="line-secret"/>
  <path d="M1190 445V505" class="line-blue"/><path d="M1190 575V645H965V690" class="line-blue"/><path d="M1190 645V690" class="line-blue"/><path d="M1190 645H1415V690" class="line-blue"/>
  <path d="M1370 284V625H1450V675" class="line-secret"/>
  <rect x="850" y="215" width="215" height="69" rx="7" class="box"/>
  <text x="957.5" y="245.5" text-anchor="middle" class="name" style="font-size:14px">Agent Definition</text>
  <text x="957.5" y="266.5" text-anchor="middle" class="sub">version · policy</text>

  <rect x="1082" y="215" width="215" height="69" rx="7" class="box"/>
  <text x="1189.5" y="245.5" text-anchor="middle" class="name" style="font-size:14px">Durable State</text>
  <text x="1189.5" y="266.5" text-anchor="middle" class="sub">trajectory · events</text>

  <rect x="1314" y="215" width="215" height="69" rx="7" class="secret"/>
  <text x="1421.5" y="245.5" text-anchor="middle" class="name" style="font-size:13px">Secret Vault / Broker</text>
  <text x="1421.5" y="266.5" text-anchor="middle" class="sub">长期凭据 · RBAC</text>

  <rect x="1314" y="215" width="5" height="69" rx="2" fill="#6a83e3"/>
  <rect x="930" y="350" width="520" height="95" rx="7" class="key"/>
  <text x="1190" y="393.5" text-anchor="middle" class="name" style="font-size:17px">Cloud Agent Harness</text>
  <text x="1190" y="414.5" text-anchor="middle" class="sub">model loop · scheduling · recovery</text>

  <rect x="960" y="505" width="460" height="70" rx="7" class="box"/>
  <text x="1190" y="536" text-anchor="middle" class="name" style="font-size:14px">Execution API / Lease Manager</text>
  <text x="1190" y="557" text-anchor="middle" class="sub">创建、替换、回收并注入任务级环境</text>

  <text x="1450" y="615" text-anchor="end" class="label">仅注入 scoped env / short-lived token</text>
  <rect x="850" y="650" width="680" height="205" rx="11" class="box"/><text x="872" y="680" class="label mono">SANDBOX LEASES</text>
  <rect x="875" y="690" width="180" height="108" rx="7" class="sandbox-frame"/>
  <text x="965" y="740" text-anchor="middle" class="name" style="font-size:14px">Sandbox A</text>
  <text x="965" y="761" text-anchor="middle" class="sub">Code · task env</text>

  <rect x="1100" y="690" width="180" height="108" rx="7" class="sandbox-frame"/>
  <text x="1190" y="740" text-anchor="middle" class="name" style="font-size:14px">Sandbox B</text>
  <text x="1190" y="761" text-anchor="middle" class="sub">Browser · session token</text>

  <rect x="1325" y="690" width="180" height="108" rx="7" class="sandbox-frame"/>
  <text x="1415" y="740" text-anchor="middle" class="name" style="font-size:14px">Sandbox C</text>
  <text x="1415" y="761" text-anchor="middle" class="sub">GPU · job env</text>


  <rect x="42" y="930" width="1516" height="48" rx="7" class="foot"/><text x="62" y="950" class="foot-title">凭据边界</text><text x="62" y="968" class="foot-copy">左：运行凭据进入 Sandbox，并与 Harness 共享故障边界。右：长期 secrets 留在控制面，Sandbox 只接收当前任务所需的短期权限。</text>
</svg>