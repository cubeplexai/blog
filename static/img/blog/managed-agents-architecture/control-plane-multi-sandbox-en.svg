<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Decoupling the Harness from Sandboxes</title>
  <desc id="desc">One long-running Managed Agent can control multiple isolated execution environments on demand.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#27272a" stroke-width=".7"/></pattern>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7Z" fill="#6a83e3"/></marker>
    <marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7Z" fill="#71717a"/></marker>
    <style>
      text{font-family:Inter,'PingFang SC','Noto Sans SC',sans-serif}
      .mono{font-family:'JetBrains Mono','PingFang SC','Noto Sans SC',monospace}
      .title{fill:#f4f4f5;font-size:30px;font-weight:700;letter-spacing:-.5px}
      .subtitle{fill:#a1a1aa;font-size:15px}
      .panel{fill:#0a0a0b;stroke:#3f3f46;stroke-width:1.3}
      .panel-title{fill:#93a6ec;font-size:17px;font-weight:650}
      .panel-copy{fill:#71717a;font-size:12px}
      .box{fill:#0a0a0b;stroke:#3f3f46;stroke-width:1.25}
      .key{fill:#14213d;stroke:#6a83e3;stroke-width:1.7}
      .sandbox-frame{fill:#0c2f28;stroke:#34d399;stroke-width:1.7}
      .secret{fill:#101014;stroke:#52525b;stroke-width:1.25}
      .name{fill:#f4f4f5;font-size:15px;font-weight:600}
      .sub{fill:#a1a1aa;font-size:11.5px}
      .tiny{fill:#71717a;font-size:10.5px}
      .label{fill:#93a6ec;font-size:10.5px;font-weight:600}
      .line-blue{fill:none;stroke:#6a83e3;stroke-width:1.8;marker-end:url(#arrow-blue);stroke-linejoin:round}
      .line-gray{fill:none;stroke:#71717a;stroke-width:1.4;marker-end:url(#arrow-gray);stroke-linejoin:round}
      .line-secret{fill:none;stroke:#6a83e3;stroke-width:1.3;stroke-dasharray:5 5;marker-end:url(#arrow-blue);stroke-linejoin:round}
      .chip{fill:#18181b;stroke:#3f3f46;stroke-width:1}
      .chip-text{fill:#d4d4d8;font-size:10.5px}
      .foot{fill:#0a0a0b;stroke:#3f3f46;stroke-width:1.1}
      .foot-title{fill:#93a6ec;font-size:11px;font-weight:650}
      .foot-copy{fill:#a1a1aa;font-size:11px}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#18181b"/><rect width="1600" height="960" fill="url(#grid)"/>

  <text x="46" y="54" class="title">Decoupling the Harness from Sandboxes</text><text x="46" y="82" class="subtitle">One long-running Managed Agent can control multiple isolated execution environments on demand.</text>
  <rect x="42" y="118" width="480" height="745" rx="14" class="panel"/><text x="72" y="155" class="panel-title">Managed Agent Control Plane</text><text x="72" y="178" class="panel-copy">Identity, run state, and long-lived credentials do not depend on one sandbox</text>
  <path d="M282 275V325" class="line-blue"/><path d="M282 420V485H170V525" class="line-gray"/><path d="M282 485H392V525" class="line-secret"/>
  <rect x="82" y="215" width="400" height="60" rx="7" class="box"/>
  <text x="282" y="241" text-anchor="middle" class="name" style="font-size:14px">AgentDefinition + Version</text>
  <text x="282" y="262" text-anchor="middle" class="sub">instructions · model · tools · permissions</text>

  <rect x="82" y="325" width="400" height="95" rx="7" class="key"/>
  <text x="282" y="368.5" text-anchor="middle" class="name" style="font-size:17px">Cloud Agent Harness</text>
  <text x="282" y="389.5" text-anchor="middle" class="sub">plan · model loop · fan-out · merge · recovery</text>

  <rect x="72" y="525" width="205" height="110" rx="7" class="box"/>
  <text x="174.5" y="554" text-anchor="middle" class="name" style="font-size:13px">Durable Run State</text>
  <text x="174.5" y="575" text-anchor="middle" class="sub">trajectory · leases · events · artifacts</text>
  <text x="174.5" y="595" text-anchor="middle" class="tiny mono">checkpoint · idempotency keys</text>
  <rect x="287" y="525" width="205" height="110" rx="7" class="secret"/>
  <text x="389.5" y="554" text-anchor="middle" class="name" style="font-size:12.5px">Secret Vault / Broker</text>
  <text x="389.5" y="575" text-anchor="middle" class="sub">long-lived secrets · policy</text>
  <text x="389.5" y="595" text-anchor="middle" class="tiny mono">issue scoped env / short-lived tokens</text>
  <rect x="287" y="525" width="5" height="110" rx="2" fill="#6a83e3"/>
  <rect x="82" y="700" width="400" height="72" rx="7" class="box"/>
  <text x="282" y="732" text-anchor="middle" class="name" style="font-size:14px">Wait for approval / timer / webhook</text>
  <text x="282" y="753" text-anchor="middle" class="sub">Agent state persists with zero active sandboxes</text>


  <rect x="578" y="118" width="980" height="610" rx="14" class="panel"/><text x="608" y="155" class="panel-title">Sandbox Pool · Isolated Compute</text><text x="608" y="178" class="panel-copy">Each lease has its own image, network policy, environment, and lifecycle</text>
  <path d="M522 372H555V250H750V285" class="line-blue"/><path d="M555 250H1070V285" class="line-blue"/><path d="M555 250H1390V285" class="line-blue"/>
  <path d="M492 580H545V270H720" class="line-secret"/><text x="600" y="239" class="label">fan-out + scoped env</text>
  <rect x="620" y="285" width="280" height="180" rx="7" class="key"/>
  <text x="760" y="371" text-anchor="middle" class="name" style="font-size:15px">Sandbox A · Code</text>
  <text x="760" y="392" text-anchor="middle" class="sub">repair A / isolated Git branch</text>
  <rect x="650" y="410" width="105" height="25" rx="4" class="chip"/><text x="702.5" y="427" text-anchor="middle" class="chip-text">Shell · Files</text><rect x="765" y="410" width="105" height="25" rx="4" class="chip"/><text x="817.5" y="427" text-anchor="middle" class="chip-text">ENV · repo token</text>
  <rect x="930" y="285" width="280" height="180" rx="7" class="key"/>
  <text x="1070" y="371" text-anchor="middle" class="name" style="font-size:15px">Sandbox B · Browser</text>
  <text x="1070" y="392" text-anchor="middle" class="sub">page validation / isolated network context</text>
  <rect x="960" y="410" width="105" height="25" rx="4" class="chip"/><text x="1012.5" y="427" text-anchor="middle" class="chip-text">Browser</text><rect x="1075" y="410" width="105" height="25" rx="4" class="chip"/><text x="1127.5" y="427" text-anchor="middle" class="chip-text">ENV · session token</text>
  <rect x="1240" y="285" width="280" height="180" rx="7" class="key"/>
  <text x="1380" y="371" text-anchor="middle" class="name" style="font-size:14px">Sandbox C · GPU / Matrix</text>
  <text x="1380" y="392" text-anchor="middle" class="sub">special hardware / dependency variants</text>
  <rect x="1270" y="410" width="105" height="25" rx="4" class="chip"/><text x="1322.5" y="427" text-anchor="middle" class="chip-text">GPU job</text><rect x="1385" y="410" width="105" height="25" rx="4" class="chip"/><text x="1437.5" y="427" text-anchor="middle" class="chip-text">ENV · job credential</text>
  <path d="M760 465V535H1070V570" class="line-gray"/><path d="M1070 465V570" class="line-gray"/><path d="M1380 465V535H1070V570" class="line-gray"/>
  <rect x="760" y="570" width="620" height="70" rx="7" class="box"/>
  <text x="1070" y="601" text-anchor="middle" class="name" style="font-size:15px">Result / Artifact References</text>
  <text x="1070" y="622" text-anchor="middle" class="sub">patch · tests · screenshots · metrics</text>


  <path d="M1070 640V770H980" class="line-gray"/><text x="1086" y="754" class="label">fan-in</text>
  <rect x="620" y="770" width="760" height="74" rx="7" class="key"/>
  <text x="1000" y="803" text-anchor="middle" class="name" style="font-size:16px">Harness merges results and chooses the next step</text>
  <text x="1000" y="824" text-anchor="middle" class="sub">handle partial failure · merge artifacts · release leases</text>

  <path d="M620 807H530V372H522" class="line-blue"/>
  <rect x="42" y="885" width="1516" height="48" rx="7" class="foot"/><text x="62" y="914" class="foot-copy">Long-lived identity, state, and secrets stay in the control plane; a sandbox receives only the execution context required by its current lease.</text>
</svg>