<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc">
  <title id="title">Agent 平台的 Sandbox 选型流程指南</title>
  <desc id="desc">以两条正交且独立的候选路径展示 OpenSandbox 和 CubeSandbox 的选择条件，最后汇入同一套 POC 验收。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#27272a" stroke-width=".7"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#71717a"/></marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#6a83e3"/></marker>
    <style>
      text{font-family:Inter,'PingFang SC','Noto Sans SC',sans-serif}
      .title{fill:#f4f4f5;font-size:28px;font-weight:650;letter-spacing:-.4px}
      .subtitle{fill:#a1a1aa;font-size:14px}
      .lane{fill:#0a0a0b;stroke:#3f3f46;stroke-width:1.2}
      .lane-title{fill:#93a6ec;font-size:14px;font-weight:650}
      .lane-copy{fill:#71717a;font-size:11.5px}
      .box-mask{fill:#0a0a0b}
      .box{fill:#0a0a0b;stroke:#3f3f46;stroke-width:1.25}
      .key{fill:#14213d;stroke:#6a83e3;stroke-width:1.6}
      .name{fill:#f4f4f5;font-size:15px;font-weight:600}
      .sub{fill:#a1a1aa;font-size:11.5px}
      .line{fill:none;stroke:#71717a;stroke-width:1.5;marker-end:url(#arrow);stroke-linejoin:round}
      .line-key{fill:none;stroke:#6a83e3;stroke-width:1.8;marker-end:url(#arrow-blue);stroke-linejoin:round}
      .dash{fill:none;stroke:#52525b;stroke-width:1.25;stroke-dasharray:5 5}
      .label{fill:#93a6ec;font-size:11px;font-weight:600}
      .foot{fill:#0a0a0b;stroke:#3f3f46;stroke-width:1.1}
      .foot-title{fill:#93a6ec;font-size:12px;font-weight:650}
      .foot-copy{fill:#a1a1aa;font-size:12px}
    </style>
  </defs>
  <rect width="1600" height="1010" fill="#18181b"/><rect width="1600" height="1010" fill="url(#grid)"/>
  <text x="48" y="52" class="title">Agent 平台的 Sandbox 选型流程指南</text>
  <text x="48" y="78" class="subtitle">不要从功能清单打分开始。先确认 Sandbox 只是运行时层，再根据产品接口与基础设施硬约束走两条不交叉的候选路径。</text>

  <!-- top-to-bottom common path -->
  <path d="M800 196 V245" class="line-key"/>
  <path d="M800 315 V370 H470 V420" class="line-key"/>
  <path d="M800 315 V370 H1130 V420" class="line-key"/>

  <!-- lane internals -->
  <path d="M470 540 V570" class="line-key"/>
  <path d="M470 640 V670" class="line-key"/>
  <path d="M1130 540 V570" class="line-key"/>
  <path d="M1130 640 V670" class="line-key"/>
  <path d="M1130 740 V760" class="line-key"/>
  <path d="M470 740 V825 H800 V865" class="line"/>
  <path d="M1130 830 V845 H800 V865" class="line"/>

  <rect x="500" y="120" width="600" height="76" rx="18" class="box-mask"/><rect x="500" y="120" width="600" height="76" rx="18" class="key"/>
  <text x="800" y="151" text-anchor="middle" class="name">Agent 产品需要一个受控的执行环境</text>
  <text x="800" y="173" text-anchor="middle" class="sub">代码、浏览器、任务或有状态服务的安全运行层</text>
  <rect x="360" y="245" width="880" height="70" rx="8" class="box-mask"/><rect x="360" y="245" width="880" height="70" rx="8" class="box"/>
  <text x="800" y="273" text-anchor="middle" class="name">先定边界：两者都是 Agent 平台的 Sandbox / Runtime 层</text>
  <text x="800" y="294" text-anchor="middle" class="sub">模型网关、编排、记忆、审计、租户计费仍由你的 Agent 平台负责</text>

  <rect x="120" y="390" width="700" height="450" rx="12" class="lane"/>
  <rect x="780" y="390" width="700" height="450" rx="12" class="lane"/>
  <text x="150" y="422" class="lane-title">路径 A · 接口与可替换 runtime 优先</text>
  <text x="150" y="442" class="lane-copy">适合多入口 Agent 平台、MCP/SDK 集成与后端可迁移性。</text>
  <text x="810" y="422" class="lane-title">路径 B · E2B / MicroVM / 节点执行能力优先</text>
  <text x="810" y="442" class="lane-copy">适合高隔离、状态型长任务、模板恢复和专用计算节点池。</text>

  <rect x="260" y="470" width="420" height="70" rx="7" class="box-mask"/><rect x="260" y="470" width="420" height="70" rx="7" class="key"/>
  <text x="470" y="499" text-anchor="middle" class="name">硬约束：协议、MCP、多语言 SDK、运行时可替换？</text>
  <text x="470" y="520" text-anchor="middle" class="sub">将 Sandbox 作为平台的统一 Tool Runtime contract</text>
  <rect x="260" y="570" width="420" height="70" rx="7" class="box-mask"/><rect x="260" y="570" width="420" height="70" rx="7" class="key"/>
  <text x="470" y="599" text-anchor="middle" class="name">候选：OpenSandbox</text>
  <text x="470" y="620" text-anchor="middle" class="sub">protocol / OpenAPI · SDK · CLI · MCP</text>
  <rect x="260" y="670" width="420" height="70" rx="7" class="box-mask"/><rect x="260" y="670" width="420" height="70" rx="7" class="box"/>
  <text x="470" y="699" text-anchor="middle" class="name">POC 重点：provider 语义</text>
  <text x="470" y="720" text-anchor="middle" class="sub">Docker / K8s 的 volume、snapshot、secure runtime 是否一致</text>

  <rect x="920" y="470" width="420" height="70" rx="7" class="box-mask"/><rect x="920" y="470" width="420" height="70" rx="7" class="key"/>
  <text x="1130" y="499" text-anchor="middle" class="name">硬约束：E2B、MicroVM、高密度或长状态任务？</text>
  <text x="1130" y="520" text-anchor="middle" class="sub">将 sandbox 作为产品差异化的执行基础设施</text>
  <rect x="920" y="570" width="420" height="70" rx="7" class="box-mask"/><rect x="920" y="570" width="420" height="70" rx="7" class="key"/>
  <text x="1130" y="599" text-anchor="middle" class="name">候选：CubeSandbox</text>
  <text x="1130" y="620" text-anchor="middle" class="sub">E2B compatible · KVM MicroVM · CubeCoW</text>
  <rect x="920" y="670" width="420" height="70" rx="7" class="box-mask"/><rect x="920" y="670" width="420" height="70" rx="7" class="box"/>
  <text x="1130" y="699" text-anchor="middle" class="name">硬门槛：专用节点池是否可行？</text>
  <text x="1130" y="720" text-anchor="middle" class="sub">KVM / XFS-reflink / privileged / host access</text>
  <rect x="920" y="760" width="420" height="70" rx="7" class="box-mask"/><rect x="920" y="760" width="420" height="70" rx="7" class="box"/>
  <text x="1130" y="789" text-anchor="middle" class="name">通过后进入 Cube K8s POC</text>
  <text x="1130" y="810" text-anchor="middle" class="sub">v0.6 Helm deployment 为 Preview；重点测升级、drain 与恢复</text>

  <text x="490" y="805" class="label">同一真实 Agent workload</text>
  <rect x="485" y="865" width="630" height="78" rx="18" class="box-mask"/><rect x="485" y="865" width="630" height="78" rx="18" class="key"/>
  <text x="800" y="896" text-anchor="middle" class="name">用同一套 POC 验收，而不是功能打分</text>
  <text x="800" y="918" text-anchor="middle" class="sub">接口契约 · 安全策略 · 状态恢复 · p95/p99 · 节点故障 · 升级回滚 · 单位任务成本</text>

  <rect x="42" y="968" width="1516" height="28" rx="6" class="foot"/>
  <text x="62" y="987" class="foot-copy">提示：两条路径可以同时进入 POC，但不应承诺“无缝双栈”。先在平台侧定义最小 Tool Runtime Contract，再验证生命周期、网络、卷与故障语义。</text>
</svg>
