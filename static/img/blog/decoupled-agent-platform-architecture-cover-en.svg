    <rect x="245" y="165" width="60" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <circle cx="275" cy="195" r="14" fill="#d97706" opacity="0.15"/>
    <path d="M271 195v-4a4 4 0 0 1 8 0v4m-10 0h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2Z" fill="none" stroke="#d97706" stroke-width="1.6"/>

