    <rect x="18" y="58" width="130" height="22" rx="4" fill="#1463e9"/>
    <text x="83" y="73" fill="#ffffff" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Brain · Control Plane</text>
    <text x="18" y="106" fill="#17191c" font-family="Inter, sans-serif" font-size="15" font-weight="750">Control Plane</text>
    
    <rect x="18" y="122" width="189" height="42" rx="6" fill="#ffffff" stroke="#1463e9" stroke-width="1.2"/>
