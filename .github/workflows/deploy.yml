name: Build and deploy blog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cubeplex-blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and check
        run: pnpm check
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: blog-site-build
          path: build/
          if-no-files-found: error

  deploy-cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CF_API_TOKEN != '' && secrets.CF_ACCOUNT_ID != ''
    needs: build-and-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: blog-site-build
          path: build/
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy build --project-name=cubeplex-blog --branch=main
